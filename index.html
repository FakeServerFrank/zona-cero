<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zona Cero</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1e1b3a;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#joy{position:fixed;left:max(28px,env(safe-area-inset-left));bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3)}
#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
#fire{position:fixed;right:max(34px,env(safe-area-inset-right));bottom:34px;width:92px;height:92px;border-radius:50%;border:0;background:#ffb547;color:#2a1d00;font:700 16px system-ui,sans-serif}
#cross{position:fixed;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid #fff;border-radius:50%;opacity:.75;pointer-events:none}
#tag{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff;font:700 15px system-ui,sans-serif;opacity:.8;pointer-events:none}
</style>
</head>
<body>
<div id="tag">Zona Cero</div>
<div id="cross"></div>
<div id="joy"><div id="knob"></div></div>
<button id="fire">Disparar</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var R=new THREE.WebGLRenderer({antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(R.domElement);
var S=new THREE.Scene();S.background=new THREE.Color(0x9ec7ff);S.fog=new THREE.Fog(0x9ec7ff,30,90);
var C=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x556677,1));
var sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(20,40,10);S.add(sun);

var suelo=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshLambertMaterial({color:0x6f8f5a}));
suelo.rotation.x=-Math.PI/2;S.add(suelo);

var walls=[],meshes=[suelo];
function box(x,z,w,d,h){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:0xb9a98a}));
  m.position.set(x,h/2,z);S.add(m);meshes.push(m);walls.push({x:x,z:z,w:w/2,d:d/2});
}
[[0,-8,6,1,3],[-10,0,1,10,3],[10,0,1,10,3],[0,8,6,1,3],[-5,-3,2,2,2],[5,3,2,2,2],[0,0,2,2,1.2]]
  .forEach(function(a){box.apply(null,a)});

var P=new THREE.Group();
function parte(g,c,x,y,z){var m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);P.add(m);return m}
parte(new THREE.BoxGeometry(.6,.4,.35),0x2a2656,0,.2,0);
parte(new THREE.BoxGeometry(.7,1.1,.4),0xffb547,0,.95,0);
parte(new THREE.SphereGeometry(.25,12,12),0xf1c9a5,0,1.75,0);
var arma=parte(new THREE.BoxGeometry(.1,.1,.6),0x222222,.4,1.1,-.4);
P.position.set(0,0,14);S.add(P);

var yaw=0,pitch=.35;
function choca(x,z){
  if(Math.abs(x)>57||Math.abs(z)>57)return true;
  for(var i=0;i<walls.length;i++){var w=walls[i];
    if(Math.abs(x-w.x)<w.w+.45&&Math.abs(z-w.z)<w.d+.45)return true}
  return false;
}

/* joystick */
var jid=null,jx=0,jy=0,joy=$("joy"),knob=$("knob");
function mover(e){
  var r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+65),dy=e.clientY-(r.top+65);
  var m=Math.hypot(dx,dy),k=Math.min(m,50)/(m||1);dx*=k;dy*=k;
  jx=dx/50;jy=dy/50;knob.style.transform="translate("+dx+"px,"+dy+"px)";
}
joy.addEventListener("pointerdown",function(e){jid=e.pointerId;joy.setPointerCapture(e.pointerId);mover(e)});
joy.addEventListener("pointermove",function(e){if(e.pointerId===jid)mover(e)});
function soltar(e){if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform="translate(0,0)"}}
joy.addEventListener("pointerup",soltar);joy.addEventListener("pointercancel",soltar);

/* mirar: arrastrar en el lado derecho */
var lid=null,lx=0,ly=0,cv=R.domElement;
cv.addEventListener("pointerdown",function(e){
  if(lid===null&&e.clientX>innerWidth*.35){lid=e.pointerId;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)}
});
cv.addEventListener("pointermove",function(e){
  if(e.pointerId!==lid)return;
  yaw-=(e.clientX-lx)*.006;
  pitch=Math.max(-.1,Math.min(1,pitch+(e.clientY-ly)*.004));
  lx=e.clientX;ly=e.clientY;
});
function finMirar(e){if(e.pointerId===lid)lid=null}
cv.addEventListener("pointerup",finMirar);cv.addEventListener("pointercancel",finMirar);

/* disparo */
var firing=false,ultimo=0,ray=new THREE.Raycaster(),v=new THREE.Vector3();
var bt=$("fire");
bt.addEventListener("pointerdown",function(){firing=true});
bt.addEventListener("pointerup",function(){firing=false});
bt.addEventListener("pointercancel",function(){firing=false});
document.addEventListener("contextmenu",function(e){e.preventDefault()});
function disparar(){
  ray.setFromCamera({x:0,y:0},C);
  var h=ray.intersectObjects(meshes)[0];
  var fin=h?h.point:ray.ray.at(60,new THREE.Vector3());
  var ini=arma.getWorldPosition(new THREE.Vector3());
  var l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([ini,fin]),new THREE.LineBasicMaterial({color:0xffe08a}));
  S.add(l);
  setTimeout(function(){S.remove(l);l.geometry.dispose();l.material.dispose()},70);
}

var reloj=new THREE.Clock();
function bucle(){
  requestAnimationFrame(bucle);
  var dt=Math.min(reloj.getDelta(),.05);
  var fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  var ax=fx*(-jy)+rx*jx,az=fz*(-jy)+rz*jx;
  var nx=P.position.x+ax*6*dt,nz=P.position.z+az*6*dt;
  if(!choca(nx,P.position.z))P.position.x=nx;
  if(!choca(P.position.x,nz))P.position.z=nz;
  P.rotation.y=yaw;
  var t=P.position;
  C.position.set(t.x+Math.sin(yaw)*Math.cos(pitch)*5,1.6+Math.sin(pitch)*5,t.z+Math.cos(yaw)*Math.cos(pitch)*5);
  C.lookAt(t.x,1.6,t.z);
  var ahora=performance.now();
  if(firing&&ahora-ultimo>150){ultimo=ahora;disparar()}
  R.render(S,C);
}
addEventListener("resize",function(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});
bucle();
</script>
</body>
</html>
