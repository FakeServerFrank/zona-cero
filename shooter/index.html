function veo(a,b){

  ray.set(ia,d.normalize());

}
function objetivo(b){
  var best=null,bd=1e9,bdd=0,all=bots.filter(function(o){return o.team!==b.team&&o.hp>0});
  if(b.team===1&&me.hp>0)all.push(me);
  all.forEach(function(o){var d=b.g.position.distanceTo(o.g.position),sc=d+bots.filter(function(x){return x!==b&&x.hp>0&&x.tg===o}).length*5;if(sc<bd){bd=sc;bdd=d;best=o}});
  b.tg=best;return best?{o:best,d:bdd}:null;
}
function disparoBot(b,t){
  var a=b.g.userData.gun.getWorldPosition(new THREE.Vector3()),o=t.o;
  var hit=Math.random()<Math.max(.08,.4-t.d*.01)*DIF[di].a;
  var f=new THREE.Vector3(o.g.position.x,1.2,o.g.position.z);
  if(!hit){f.x+=(Math.random()-.5)*3;f.z+=(Math.random()-.5)*3}
  traza(a,f,b.team?0xff8a8a:0x8ac8ff);fogonazo(b.g);
  if(t.d<30)snd(170,.05,"square",.03);if(hit)dano(o,o.isMe?DIF[di].d:20);
}
function ia(b,dt){
  var t=objetivo(b);if(!t)return;
  var p=b.g.position,q=t.o.g.position,dx=q.x-p.x,dz=q.z-p.z,d=t.d||1;
  b.g.rotation.y=Math.atan2(-dx,-dz);
  b.lt-=dt;if(b.lt<=0){b.lt=.25;b.los=veo(p,q)}
  b.st-=dt;if(b.st<=0){b.st=1+Math.random()*1.5;b.dir=-b.dir}
  var ux=dx/d,uz=dz/d,mx=0,mz=0;
  if(b.slide>0){b.slide-=dt;mx=-uz*b.dir;mz=ux*b.dir}
  else{
    if(b.hp<35){if(b.los){mx=-ux;mz=-uz}}else if(!b.los||d>16){mx=ux;mz=uz}else if(d<8){mx=-ux;mz=-uz}
    if(b.los){mx+=-uz*b.dir*.7;mz+=ux*b.dir*.7}
  }
  var s=4.2*dt,nx=p.x+mx*s,nz=p.z+mz*s,bx=choca(nx,p.z),bz=choca(p.x,nz);
  if(!bx)p.x=nx;if(!bz)p.z=nz;
  if((bx||bz)&&b.slide<=0){b.slide=.7;if(Math.random()<.5)b.dir=-b.dir}
  anim(b.g,(mx||mz)?1:0,dt);
  b.fire-=dt;
  if(b.los&&d<35&&b.fire<=0){b.fire=(.45+Math.random()*.5)*DIF[di].f;disparoBot(b,t)}
}

function bucle(){

  if(enLobby){
    var tt=performance.now()/1000;
    if(lid===null)lobYaw+=dt*.35;

  var des=piv.clone().addScaledVector(f,-dist).addScaledVector(rg,sh);

  if(hc&&hc.distance<ln)des=piv.clone().addScaledVector(dd,Math.max(.6,hc.distance-.3));
  des.y=Math.max(.3,des.y);
  C.position.copy(des);C.lookAt(des.x+f.x,des.y+f.y,des.z+f.z);
  fov+=((ads?(arma===2?28:48):70)-fov)*Math.min(1,dt*10);C.fov=fov;C.updateProjectionMatrix();
  recoil=Math.max(0,recoil-dt*.15);
  var base=(.012+Math.min(1,Math.hypot(jx,jy))*.03)*(ads?.4:1)*W[arma].s;
  spread+=(base-spread)*Math.min(1,dt*(spread>base?6:20));
  var sz=Math.round(8+spread*innerHeight*1.1),cr=$("cross");
  cr.style.width=cr.style.height=sz+"px";cr.style.margin=(-sz/2-2)+"px 0 0 "+(-sz/2-2)+"px";
  if(me.hp>0)anim(P,Math.min(1,Math.hypot(jx,jy)),dt);
  vt-=dt;if(vt<=0){vt=.25;bots.forEach(function(b){if(b.team&&b.hp>0){if(veo(P.position,b.g.position))b.seen=1.5;b.seen=Math.max(0,(b.seen||0)-.25);b.vis=b.seen>0}})}
  mini();
  pt=pt.filter(function(m){var u=m.userData;u.l-=dt;u.v.y-=12*dt;m.position.addScaledVector(u.v,dt);if(u.l<=0){S.remove(m);return false}return true});
  R.render(S,C);
}
