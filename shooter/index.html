  m(new THREE.BoxGeometry(.9,.9,.9),0x3b3480,-3.4,.15,-1.5);m(new THREE.BoxGeometry(.7,.7,.7),0x3b3480,3.4,.05,-1.8);
  var l1=new THREE.PointLight(0xffffff,1.1,30);l1.position.set(0,5,4);LB.add(l1);

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fila(arr,ct,own,sel,a){return arr.map(function(n,i){return '<button data-a="'+a+'" data-i="'+i+'" class="'+(sel===i?"on":"")+'">'+n+(own.indexOf(i)>=0?"":" 🔒"+ct[i])+'</button>'}).join("")}

   '<h3>Nombre: '+esc(cfg.n||"Jugador")+'</h3><button data-a="n">Cambiar nombre</button>'+
   '<h3>Color de ropa</h3>'+fila(NCOL,CCOST,cfg.o,cfg.c,"c")+
   '<h3>Arma favorita</h3>'+W.map(function(w,i){return '<button data-a="a" data-i="'+i+'" class="'+(cfg.a===i?"on":"")+'">'+w.n+'</button>'}).join("")+
   '<h3>Aspecto del arma</h3>'+fila(NSK,SCOST,cfg.os,cfg.s,"s")+

}
function aplicar(){

$("cus").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var a=t.dataset.a,i=+t.dataset.i;
  if(a==="x"){$("cus").style.display="none";return}
  if(a==="n"){var n=prompt("Tu nombre (máx. 14 letras)",cfg.n||"");if(n!==null)cfg.n=n.trim().slice(0,14)}
  else if(a==="c"||a==="s"){
    var ow=a==="c"?cfg.o:cfg.os,cs=a==="c"?CCOST:SCOST;
    if(ow.indexOf(i)<0){if(cfg.m<cs[i]){$("cm").textContent="Te faltan monedas";return}cfg.m-=cs[i];ow.push(i)}
    if(a==="c")cfg.c=i;else cfg.s=i}
  else if(a==="a"){cfg.a=i;arma=i}

var grs=[],gr=2,cura=0,vy=0,cro=false,rt=0,bomb={on:false,t:0,d:0,res:null},bm=null,modo=cfg.mo||0,SX=0,SZ=-20,actH=false,pl=0,NMO=["Eliminación","Bomba"];
var sm=new THREE.Mesh(new THREE.CircleGeometry(3,24),new THREE.MeshBasicMaterial({color:0xff4040,transparent:true,opacity:.3}));sm.rotation.x=-Math.PI/2;sm.position.set(SX,.04,SZ);S.add(sm);

function boom(p){
  chispas(p,0xffa030,24);snd(70,.4,"sawtooth",.25);
  bots.forEach(function(b){if(b.hp>0){var d=b.g.position.distanceTo(p);if(d<5.5)dano(b,Math.round(90*(1-d/5.5)),b.team===1,me)}});
  var dm=P.position.distanceTo(p);if(me.hp>0&&dm<5.5)dano(me,Math.round(60*(1-dm/5.5)),false,null);
}
function lanzar(){
  if(me.hp<=0||!jugando||gr<=0||fin)return;gr--;
  var ep=pitch-recoil,dir=new THREE.Vector3(-Math.sin(yaw)*Math.cos(ep),-Math.sin(ep)+.25,-Math.cos(yaw)*Math.cos(ep)).normalize();
  var m=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshLambertMaterial({color:0x3f5a3a}));
  m.position.set(P.position.x,P.position.y+1.5,P.position.z);S.add(m);
  grs.push({m:m,v:dir.multiplyScalar(15),t:1.7});snd(300,.1,"square",.08);
}

function desactivar(){if(!bomb.on||fin)return;bomb.on=false;bomb.res=0;S.remove(bm);aviso("Bomba desactivada",1400);revisar()}
function extra(dt){
  if(!jugando)return;
  if(P.position.y>0||vy>0){vy-=22*dt;P.position.y=Math.max(0,P.position.y+vy*dt);if(P.position.y===0)vy=0}
  grs=grs.filter(function(g){
    g.t-=dt;g.v.y-=18*dt;var p=g.m.position,nx=p.x+g.v.x*dt,nz=p.z+g.v.z*dt;
    if(choca(nx,p.z))g.v.x*=-.5;else p.x=nx;
    if(choca(p.x,nz))g.v.z*=-.5;else p.z=nz;
    p.y+=g.v.y*dt;if(p.y<.12){p.y=.12;g.v.y*=-.35;g.v.x*=.7;g.v.z*=.7}
    if(g.t<=0){boom(p);S.remove(g.m);return false}return true});
  cura=Math.max(0,cura-dt);$("hab").textContent=cura>0?Math.ceil(cura):"Curar";$("gr").textContent="💣"+gr;
  if(modo&&!fin){
    rt+=dt;
    var near=me.hp>0&&!bomb.on&&Math.hypot(P.position.x-SX,P.position.z-SZ)<3;
    $("act").style.display=near?"block":"none";
    if(near&&actH){pl+=dt;$("act").textContent="Plantando "+Math.min(100,Math.floor(pl/3*100))+"%";if(pl>=3)plantar()}else{pl=0;$("act").textContent="Plantar bomba"}
    if(bomb.on){var s0=Math.ceil(bomb.t);bomb.t-=dt;if(Math.ceil(bomb.t)!==s0)snd(900,.05,"square",.06);if(bomb.t<=0&&bomb.res===null){bomb.res=1;boom(bm.position);revisar()}}
    else if(rt>100&&bomb.res===null){bomb.res=0;revisar()}
    $("score").textContent="Azul "+win+" - "+lose+" Rojo · "+(bomb.on?"💣 "+Math.max(0,Math.ceil(bomb.t))+"s":"Planta la bomba "+Math.max(0,Math.ceil(100-rt))+"s");
  }else $("act").style.display="none";
}
